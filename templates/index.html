<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flight Delay Explorer</title>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://unpkg.com/topojson@3"></script>

<style>
body {
  margin:0;
  font-family:Inter, sans-serif;
  background:#0b0d12;
  color:#e5e7eb;
  display:flex;
}

/* MAP */
#map {
  flex:1;
  position:relative;
}

svg {
  width:100%;
  height:100vh;
}

/* PANEL */
#panel {
  width:360px;
  background:#111827;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

/* HEADER */
#airport {
  font-size:42px;
  font-weight:700;
}

#city {
  color:#9ca3af;
}

/* VERDICT */
#verdict {
  padding:10px;
  border-radius:8px;
  font-size:13px;
  font-weight:500;
}

.high { background:#7f1d1d; color:#fecaca; }
.medium { background:#78350f; color:#fde68a; }
.low { background:#064e3b; color:#bbf7d0; }

/* STATS */
.stats {
  display:flex;
  gap:10px;
}

.stat {
  flex:1;
  background:#1f2937;
  padding:10px;
  border-radius:8px;
  text-align:center;
}

.stat-value {
  font-size:18px;
  font-weight:700;
}

.stat-label {
  font-size:11px;
  color:#9ca3af;
}

/* SECTION */
.section-title {
  font-size:12px;
  color:#9ca3af;
}

/* BARS */
.bar-row { margin-bottom:10px; }

.bar-label {
  display:flex;
  justify-content:space-between;
  font-size:12px;
}

.bar-bg {
  background:#1f2937;
  height:8px;
  border-radius:4px;
}

.bar-fill {
  height:8px;
  border-radius:4px;
}

/* TOOLTIP */
#tooltip {
  position:absolute;
  background:#111827;
  padding:6px;
  border-radius:6px;
  font-size:12px;
  opacity:0;
}
</style>
</head>

<body>

<div id="map">
  <svg></svg>
  <div id="tooltip"></div>
</div>

<div id="panel">

  <div>
    <div id="airport">—</div>
    <div id="city">Click an airport</div>
  </div>

  <div id="verdict">Select an airport</div>

  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="avg">—</div>
      <div class="stat-label">AVG DELAY</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="flights">—</div>
      <div class="stat-label">FLIGHTS</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="rank">#—</div>
      <div class="stat-label">RANK</div>
    </div>
  </div>

  <div>
    <div class="section-title">WHAT’S CAUSING DELAYS?</div>
    <div id="bars"></div>
  </div>

  <div id="explain" style="font-size:13px;"></div>

</div>

<script>

// ===== GLOBAL DATA =====
let breakdownData = {};
let networkData = {};

// ===== SCALES =====
const color = d3.scaleThreshold()
  .domain([0.15,0.25])
  .range(["#34d399","#f59e0b","#ef4444"]);

const size = d3.scaleSqrt().range([3,12]);

// ===== SVG SETUP =====
const svg = d3.select("svg");
const g = svg.append("g");
const tooltip = d3.select("#tooltip");

const projection = d3.geoAlbersUsa()
  .translate([window.innerWidth/2, window.innerHeight/2])
  .scale(1000);

const path = d3.geoPath(projection);

// ===== LOAD DATA =====
Promise.all([
  d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json"),
  fetch("/api/network").then(r=>r.json()),
  fetch("/api/breakdown").then(r=>r.json())
]).then(([us, network, breakdown]) => {

  networkData = network;
  breakdownData = breakdown;

  size.domain([
    d3.min(network.nodes,d=>d.total_flights),
    d3.max(network.nodes,d=>d.total_flights)
  ]);

  drawMap(us, network);
});

// ===== DRAW MAP =====
function drawMap(us, network){

  // STATES
  g.selectAll("path")
    .data(topojson.feature(us, us.objects.states).features)
    .join("path")
    .attr("d", path)
    .attr("fill","#1f2937")
    .attr("stroke","#374151");

  // ROUTES
  g.selectAll("route")
    .data(network.edges)
    .join("path")
    .attr("d", d => {

      const source = typeof d.source === "object" ? d.source.id : d.source;
      const target = typeof d.target === "object" ? d.target.id : d.target;

      const s = network.nodes.find(n=>n.id===source);
      const t = network.nodes.find(n=>n.id===target);

      if(!s || !t) return;

      const p1 = projection([s.lon,s.lat]);
      const p2 = projection([t.lon,t.lat]);
      if(!p1 || !p2) return;

      return `M${p1[0]},${p1[1]} Q ${(p1[0]+p2[0])/2},${(p1[1]+p2[1])/2 - 30} ${p2[0]},${p2[1]}`;
    })
    .attr("stroke","#374151")
    .attr("stroke-width",0.5)
    .attr("fill","none")
    .attr("opacity",0.3);

  // AIRPORTS
  g.selectAll("circle")
    .data(network.nodes.filter(d=>d.lat && d.lon))
    .join("circle")
    .attr("cx", d => projection([d.lon,d.lat])[0])
    .attr("cy", d => projection([d.lon,d.lat])[1])
    .attr("r", d => size(d.total_flights))
    .attr("fill", d => color(d.pct_delayed))
    .attr("opacity",0.9)

    .on("mouseover",(e,d)=>{
      tooltip.style("opacity",1)
        .html(`<strong>${d.id}</strong><br>${(d.pct_delayed*100).toFixed(1)}% delayed`)
        .style("left",(e.pageX+10)+"px")
        .style("top",(e.pageY-20)+"px");
    })

    .on("mouseout",()=>tooltip.style("opacity",0))

    .on("click",(e,d)=>updatePanel(d));
}

// ===== PANEL UPDATE =====
function updatePanel(d){

  document.getElementById("airport").textContent = d.id;

  document.getElementById("city").textContent =
    d.city || "Unknown location";

  document.getElementById("avg").textContent =
    d.avg_arr_delay.toFixed(1)+" min";

  document.getElementById("flights").textContent =
    "~"+Math.round(d.total_flights/1000)+"k";

  // ===== REAL RANK =====
  const sorted = [...networkData.nodes]
    .sort((a,b)=>b.pct_delayed - a.pct_delayed);

  const rank = sorted.findIndex(n => n.id === d.id) + 1;
  document.getElementById("rank").textContent = "#" + rank;

  // ===== VERDICT =====
  const v = document.getElementById("verdict");

  if(d.pct_delayed > 0.25){
    v.className = "high";
    v.innerHTML = `⚠ High delay airport — ${(d.pct_delayed*100).toFixed(1)}% late`;
  }
  else if(d.pct_delayed < 0.15){
    v.className = "low";
    v.innerHTML = `✓ Low delay airport — ${(d.pct_delayed*100).toFixed(1)}% late`;
  }
  else{
    v.className = "medium";
    v.innerHTML = `Moderate delays — ${(d.pct_delayed*100).toFixed(1)}% late`;
  }

  drawBars(d.id);
}

// ===== BAR CHART =====
function drawBars(code){

  const container = document.getElementById("bars");
  container.innerHTML = "";

  const bd = breakdownData[code];
  if(!bd) return;

  const labels = {
    carrier:"Carrier ops",
    late_aircraft:"Late aircraft",
    nas:"Air traffic",
    weather:"Weather",
    security:"Security"
  };

  const data = Object.entries(bd)
    .map(([k,v])=>({key:k,label:labels[k],value:v}))
    .sort((a,b)=>b.value-a.value);

  const max = d3.max(data,d=>d.value);

  data.forEach(d=>{
    const width = (d.value/max)*100;

    container.innerHTML += `
      <div class="bar-row">
        <div class="bar-label">
          <span>${d.label}</span>
          <span>${d.value.toFixed(1)} min</span>
        </div>
        <div class="bar-bg">
          <div class="bar-fill" style="width:${width}%; background:#ef4444;"></div>
        </div>
      </div>
    `;
  });

  // ===== EXPLANATION =====
  const top = data[0].key;

  const explainMap = {
    carrier:"Airline operations are the main cause of delays.",
    late_aircraft:"Late incoming planes cause delays to ripple.",
    nas:"Air traffic congestion is the main issue.",
    weather:"Weather disruptions dominate delays.",
    security:"Security delays are the primary issue."
  };

  document.getElementById("explain").innerHTML =
    `<strong>In plain terms:</strong> ${explainMap[top]}`;
}

</script>

</body>
</html>
