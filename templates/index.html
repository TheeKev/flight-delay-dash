<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flight Delay Map</title>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://unpkg.com/topojson@3"></script>

<style>
body {
  margin:0;
  font-family:Segoe UI;
  background:#0f1117;
  color:#e2e8f0;
  display:flex;
}

#map {
  flex:1;
  position:relative;
}

svg {
  width:100%;
  height:100vh;
}

#panel {
  width:340px;
  background:#1a1d2e;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.card {
  background:#242740;
  padding:12px;
  border-radius:8px;
}

#verdict {
  background:#2d3748;
  padding:10px;
  border-radius:6px;
  font-size:13px;
}

#tooltip {
  position:absolute;
  background:#1a1d2e;
  padding:6px;
  border-radius:6px;
  font-size:12px;
  opacity:0;
}
</style>
</head>

<body>

<div id="map">
  <svg></svg>
  <div id="tooltip"></div>
</div>

<div id="panel">

  <div id="verdict">Click an airport</div>

  <div class="card">
    <h2 id="code">—</h2>
    <div id="stats"></div>
  </div>

  <div class="card">
    <h3>Why delays happen</h3>
    <div id="explain"></div>
  </div>

</div>

<script>

// COLOR SCALE
const color = d3.scaleThreshold()
  .domain([0.15,0.25])
  .range(["#68d391","#f6ad55","#fc8181"]);

const size = d3.scaleSqrt().range([3,12]);

const svg = d3.select("svg");
const width = window.innerWidth;
const height = window.innerHeight;

const projection = d3.geoAlbersUsa()
  .translate([width/2,height/2])
  .scale(1000);

const path = d3.geoPath(projection);

const g = svg.append("g");

const tooltip = d3.select("#tooltip");

Promise.all([
  d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json"),
  fetch("/api/network").then(r=>r.json()),
  fetch("/api/breakdown").then(r=>r.json()).catch(()=>({}))
]).then(([us, network, breakdown]) => {

  size.domain([
    d3.min(network.nodes,d=>d.total_flights),
    d3.max(network.nodes,d=>d.total_flights)
  ]);

  // DRAW STATES
  g.append("g")
    .selectAll("path")
    .data(topojson.feature(us, us.objects.states).features)
    .join("path")
    .attr("d", path)
    .attr("fill","#1a1d2e")
    .attr("stroke","#2d3748");

  // DRAW ROUTES
  g.append("g")
    .selectAll("path")
    .data(network.edges)
    .join("path")
    .attr("d", d => {
      const s = network.nodes.find(n=>n.id===d.source);
      const t = network.nodes.find(n=>n.id===d.target);

      if(!s || !t) return;

      const p1 = projection([s.lon,s.lat]);
      const p2 = projection([t.lon,t.lat]);
      if(!p1 || !p2) return;

      return `M${p1[0]},${p1[1]} Q ${(p1[0]+p2[0])/2},${(p1[1]+p2[1])/2 - 30} ${p2[0]},${p2[1]}`;
    })
    .attr("stroke","#2d3748")
    .attr("stroke-width",0.5)
    .attr("fill","none")
    .attr("opacity",0.3);

  // DRAW AIRPORTS
  g.append("g")
    .selectAll("circle")
    .data(network.nodes.filter(d=>d.lat && d.lon))
    .join("circle")
    .attr("cx", d => projection([d.lon,d.lat])[0])
    .attr("cy", d => projection([d.lon,d.lat])[1])
    .attr("r", d => size(d.total_flights))
    .attr("fill", d => color(d.pct_delayed))
    .attr("opacity",0.9)

    .on("mouseover",(e,d)=>{
      tooltip.style("opacity",1)
        .html(`${d.id}<br>${(d.pct_delayed*100).toFixed(1)}% delayed`)
        .style("left",(e.pageX+10)+"px")
        .style("top",(e.pageY-20)+"px");
    })

    .on("mouseout",()=>tooltip.style("opacity",0))

    .on("click",(e,d)=>{
      updatePanel(d, breakdown);
    });

});

// PANEL UPDATE
function updatePanel(d, breakdown){

  document.getElementById("code").textContent = d.id;

  document.getElementById("stats").innerHTML = `
    Flights: ${d.total_flights}<br>
    Delay rate: ${(d.pct_delayed*100).toFixed(1)}%<br>
    Avg delay: ${d.avg_arr_delay.toFixed(1)} min
  `;

  // VERDICT
  let level="Moderate delay airport";
  if(d.pct_delayed>0.25) level="High delay airport";
  if(d.pct_delayed<0.15) level="Low delay airport";

  document.getElementById("verdict").innerHTML =
    `<strong>${level}</strong> — ${(d.pct_delayed*100).toFixed(1)}% of flights arrive late`;

  // EXPLANATION
  if(!breakdown[d.id]){
    document.getElementById("explain").innerHTML="No data";
    return;
  }

  const bd = breakdown[d.id];

  const top = Object.entries(bd).sort((a,b)=>b[1]-a[1])[0][0];

  const explainMap = {
    carrier:"Airline operations (staffing, maintenance) drive most delays.",
    late_aircraft:"Delays are caused by late incoming planes from other cities.",
    nas:"Air traffic congestion is the main cause here.",
    weather:"Weather is the dominant delay factor.",
    security:"Security delays are the primary issue."
  };

  document.getElementById("explain").innerHTML = explainMap[top];
}

</script>

</body>
</html>
