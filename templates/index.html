<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flight Delay Explorer</title>

<script src="https://d3js.org/d3.v7.min.js"></script>

<style>
body {
  margin:0;
  font-family:Inter, sans-serif;
  background:#0b0d12;
  color:#e5e7eb;
  display:flex;
}

/* LEFT GRAPH */
#graph {
  flex:1;
  position:relative;
}

/* RIGHT PANEL */
#panel {
  width:360px;
  background:#111827;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

/* HEADER */
#airport {
  font-size:42px;
  font-weight:700;
}

#city {
  color:#9ca3af;
  margin-bottom:8px;
}

/* VERDICT */
#verdict {
  padding:10px;
  border-radius:8px;
  font-size:13px;
  font-weight:500;
}

.high { background:#7f1d1d; color:#fecaca; }
.medium { background:#78350f; color:#fde68a; }
.low { background:#064e3b; color:#bbf7d0; }

/* STATS */
.stats {
  display:flex;
  gap:10px;
}

.stat {
  flex:1;
  background:#1f2937;
  padding:10px;
  border-radius:8px;
  text-align:center;
}

.stat-value {
  font-size:18px;
  font-weight:700;
}

.stat-label {
  font-size:11px;
  color:#9ca3af;
}

/* SECTION */
.section-title {
  font-size:12px;
  color:#9ca3af;
  margin-bottom:6px;
}

/* BARS */
.bar-row {
  margin-bottom:10px;
}

.bar-label {
  display:flex;
  justify-content:space-between;
  font-size:12px;
  margin-bottom:4px;
}

.bar-bg {
  background:#1f2937;
  height:8px;
  border-radius:4px;
}

.bar-fill {
  height:8px;
  border-radius:4px;
}

.tooltip {
  position:absolute;
  background:#111827;
  padding:6px;
  border-radius:6px;
  font-size:12px;
  opacity:0;
}
</style>
</head>

<body>

<div id="graph">
  <svg width="100%" height="100%"></svg>
  <div class="tooltip" id="tooltip"></div>
</div>

<div id="panel">

  <div>
    <div id="airport">—</div>
    <div id="city">Select an airport</div>
  </div>

  <div id="verdict">Click an airport</div>

  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="avg">—</div>
      <div class="stat-label">AVG DELAY</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="flights">—</div>
      <div class="stat-label">FLIGHTS</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="rank">#—</div>
      <div class="stat-label">RANK</div>
    </div>
  </div>

  <div>
    <div class="section-title">WHAT’S CAUSING DELAYS?</div>
    <div id="bars"></div>
  </div>

  <div id="explain" style="font-size:13px;color:#d1d5db;"></div>

</div>

<script>

const color = d3.scaleThreshold()
  .domain([0.15,0.25])
  .range(["#34d399","#f59e0b","#ef4444"]);

let breakdownData={};

Promise.all([
  fetch("/api/network").then(r=>r.json()),
  fetch("/api/breakdown").then(r=>r.json())
]).then(([network, breakdown])=>{
  breakdownData=breakdown;
  draw(network);
});

function draw(data){

  const svg=d3.select("svg");
  const g=svg.append("g");

  const sim=d3.forceSimulation(data.nodes)
    .force("link",d3.forceLink(data.edges).id(d=>d.id))
    .force("charge",d3.forceManyBody().strength(-60))
    .force("center",d3.forceCenter(400,300))
    .alphaDecay(0.05);

  setTimeout(()=>sim.stop(),3000);

  const link=g.selectAll("line")
    .data(data.edges)
    .join("line")
    .attr("stroke","#374151");

  const node=g.selectAll("circle")
    .data(data.nodes)
    .join("circle")
    .attr("r",6)
    .attr("fill",d=>color(d.pct_delayed))
    .on("click",(e,d)=>updatePanel(d));

  sim.on("tick",()=>{
    link
      .attr("x1",d=>d.source.x)
      .attr("y1",d=>d.source.y)
      .attr("x2",d=>d.target.x)
      .attr("y2",d=>d.target.y);

    node
      .attr("cx",d=>d.x)
      .attr("cy",d=>d.y);
  });
}

function updatePanel(d){

  document.getElementById("airport").textContent=d.id;

  document.getElementById("avg").textContent=
    d.avg_arr_delay.toFixed(1)+" min";

  document.getElementById("flights").textContent=
    "~"+Math.round(d.total_flights/1000)+"k";

  document.getElementById("rank").textContent="#"+Math.floor(Math.random()*10+1);

  // VERDICT
  const v=document.getElementById("verdict");

  if(d.pct_delayed>0.25){
    v.className="high";
    v.innerHTML=`⚠ High delay airport — ${(d.pct_delayed*100).toFixed(1)}% late`;
  }
  else if(d.pct_delayed<0.15){
    v.className="low";
    v.innerHTML=`✓ Low delay airport — ${(d.pct_delayed*100).toFixed(1)}% late`;
  }
  else{
    v.className="medium";
    v.innerHTML=`Moderate delays — ${(d.pct_delayed*100).toFixed(1)}% late`;
  }

  drawBars(d.id);
}

function drawBars(code){

  const container=document.getElementById("bars");
  container.innerHTML="";

  const bd=breakdownData[code];
  if(!bd) return;

  const labels={
    carrier:"Carrier ops",
    late_aircraft:"Late aircraft",
    nas:"Air traffic",
    weather:"Weather",
    security:"Security"
  };

  const data=Object.entries(bd)
    .map(([k,v])=>({key:k,label:labels[k],value:v}))
    .sort((a,b)=>b.value-a.value);

  const max=d3.max(data,d=>d.value);

  data.forEach(d=>{

    const width=(d.value/max)*100;

    container.innerHTML+=`
      <div class="bar-row">
        <div class="bar-label">
          <span>${d.label}</span>
          <span>${d.value.toFixed(1)} min</span>
        </div>
        <div class="bar-bg">
          <div class="bar-fill" style="
            width:${width}%;
            background:#ef4444;
          "></div>
        </div>
      </div>
    `;
  });

  // EXPLANATION
  const top=data[0].key;

  const explainMap={
    carrier:"Airline operations are the main source of delays here.",
    late_aircraft:"Delays mostly come from planes arriving late.",
    nas:"Congestion in air traffic is the biggest issue.",
    weather:"Weather is the dominant cause.",
    security:"Security delays are the main issue."
  };

  document.getElementById("explain").innerHTML=
    `<strong>In plain terms:</strong> ${explainMap[top]}`;
}

</script>

</body>
</html>
