<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flight Delay Explorer</title>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://unpkg.com/topojson@3"></script>

<style>

:root {
  --bg: #d8e2eb;
  --panel: rgba(255, 255, 255, 0.86);
  --panel-border: #cdd7e3;
  --text: #102033;
  --muted: #5f7186;
  --route: #7f94aa;
  --route-active: #4b6580;
  --state-fill: #eef3f8;
  --state-stroke: #c7d2df;
  --card: #f6f9fc;
  --card-border: #d7e0ea;
  --tooltip-bg: rgba(255, 255, 255, 0.97);
  --tooltip-border: #c7d2df;
  --legend-bg: rgba(255, 255, 255, 0.82);
}

body {
  margin:0;
  font-family:Inter, sans-serif;
  background: var(--bg);
  color: var(--text);
  display:flex;
}

#map { flex:1; position:relative; }
svg { width:100%; height:100vh; }

#panel {
  width:360px;
  background: var(--panel);
  border-left: 1px solid var(--panel-border);
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:16px;
  backdrop-filter: blur(12px);
}

#airport { font-size:36px; font-weight:700; }
#city { color: var(--muted); }

#verdict { padding:10px; border-radius:8px; }
.high { background:#fde2e2; color:#991b1b; border:1px solid #f8b4b4; }
.medium { background:#fff3d6; color:#92400e; border:1px solid #f3d08b; }
.low { background:#d9f8ea; color:#065f46; border:1px solid #a7e4c4; }

.stats { display:flex; gap:10px; }
.stat {
  flex:1;
  background: var(--card);
  border: 1px solid var(--card-border);
  padding:10px;
  border-radius:8px;
  text-align:center;
}

.bar-bg { background:#e6edf4; height:8px; border-radius:4px; overflow:hidden; }
.bar-fill { height:8px; border-radius:4px; transition:width 0.5s; background:#5b7c99 !important; }

#tooltip {
  position:absolute;
  background: var(--tooltip-bg);
  border: 1px solid var(--tooltip-border);
  color: var(--text);
  padding:8px 10px;
  border-radius:10px;
  font-size:12px;
  box-shadow: 0 12px 28px rgba(16, 32, 51, 0.14);
  opacity:0;
  pointer-events:none;
}

.zoom-controls {
  position:absolute;
  top:10px;
  left:10px;
}
.zoom-controls button {
  background: rgba(255,255,255,0.92);
  border:1px solid #c7d2df;
  color: var(--text);
  padding:6px;
  margin-bottom:4px;
  cursor:pointer;
  border-radius:6px;
}

#legend {
  position:absolute;
  bottom:10px;
  left:10px;
  background: var(--legend-bg);
  color: var(--text);
  border: 1px solid #d7e0ea;
  padding:8px;
  border-radius:6px;
  backdrop-filter: blur(10px);
}

.route-checker {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 10px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.route-checker h3 {
  margin: 0;
  font-size: 14px;
}

.route-checker label {
  font-size: 12px;
  color: var(--muted);
}

.route-checker select,
.route-checker button {
  width: 100%;
  border: 1px solid var(--card-border);
  border-radius: 8px;
  padding: 8px;
  background: #ffffff;
  color: var(--text);
}

.route-checker button {
  cursor: pointer;
  font-weight: 600;
  background: #edf3f9;
}

.route-result {
  font-size: 12px;
  color: var(--text);
  line-height: 1.45;
}

.route-result.muted {
  color: var(--muted);
}
</style>
</head>

<body>

<div id="map">
  <svg></svg>
  <div id="tooltip"></div>

  <div class="zoom-controls">
    <button onclick="zoomIn()">+</button>
    <button onclick="zoomOut()">−</button>
  </div>

  <div id="legend">
    <div><span style="color:#22c55e">●</span> Low delay</div>
    <div><span style="color:#f59e0b">●</span> Medium delay</div>
    <div><span style="color:#ef4444">●</span> High delay</div>
  </div>
</div>

<div id="panel">
  <div>
    <div id="airport">—</div>
    <div id="city">Click an airport</div>
  </div>

  <div id="verdict">Select an airport</div>

  <div class="stats">
    <div class="stat"><div id="avg">—</div><div>AVG DELAY</div></div>
    <div class="stat"><div id="flights">—</div><div>FLIGHTS</div></div>
    <div class="stat"><div id="rank">#—</div><div>RANK</div></div>
  </div>

  <div id="bars"></div>
  <div id="explain"></div>
  <div id="alternatives"></div>

  <div id="route-checker" class="route-checker">
    <h3>Route Checker</h3>
    <label for="route-src">Origin</label>
    <select id="route-src"></select>

    <label for="route-dst">Destination</label>
    <select id="route-dst"></select>

    <button id="route-check-btn" type="button">Check route</button>
    <div id="route-result" class="route-result muted">Choose airports to view route details.</div>
  </div>
</div>

<script>

let networkData = {};
let breakdownData = {};
let destinationsBySource = new Map();
let routeSelection = null;
let selectedRoute = null;
const svg = d3.select("svg");
const g = svg.append("g");
const tooltip = d3.select("#tooltip");

// ZOOM
const zoom = d3.zoom()
  .scaleExtent([1,8])
  .on("zoom", e => g.attr("transform", e.transform));

svg.call(zoom);

function zoomIn(){ svg.transition().call(zoom.scaleBy,1.5); }
function zoomOut(){ svg.transition().call(zoom.scaleBy,0.7); }

// PROJECTION
const projection = d3.geoAlbersUsa()
  .translate([window.innerWidth/2, window.innerHeight/2])
  .scale(1000);

const path = d3.geoPath(projection);

const color = d3.scaleThreshold()
  .domain([0.15,0.25])
  .range(["#2ecc71","#f4b942","#e25555"]);

Promise.all([
  d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json"),
  fetch("/api/network").then(r=>r.json()),
  fetch("/api/breakdown").then(r=>r.json())
]).then(([us, network, breakdown]) => {

  networkData = network;
  breakdownData = breakdown;
  initRouteChecker(network);

  // STATES
  g.selectAll("path")
    .data(topojson.feature(us, us.objects.states).features)
    .join("path")
    .attr("d", path)
    .attr("fill","var(--state-fill)")
    .attr("stroke","var(--state-stroke)");

  // ROUTES
  const routes = g.selectAll("path.route")
    .data(network.edges)
    .join("path")
    .attr("class", "route")
    .attr("stroke","var(--route)")
    .attr("stroke-linecap", "round")
    .attr("fill","none")
    .attr("opacity",0.16)
    .attr("stroke-width", d => Math.max(1, Math.min(3.5, Math.log10((d.flight_count || 1)))))
    .attr("d", d => {
      const s = network.nodes.find(n=>n.id===d.source);
      const t = network.nodes.find(n=>n.id===d.target);
      if(!s || !t) return;

      const p1 = projection([s.lon,s.lat]);
      const p2 = projection([t.lon,t.lat]);

      if(!p1 || !p2) return;

      return `M${p1[0]},${p1[1]} L${p2[0]},${p2[1]}`;
    })

    .on("mouseover", (e, d) => {
      const src = typeof d.source === "object" ? d.source.id : d.source;
      const dst = typeof d.target === "object" ? d.target.id : d.target;

      tooltip
        .style("opacity", 1)
        .html(`
          <b>${src} → ${dst}</b><br>
          flights: ${d.flight_count ?? "n/a"}<br>
          avg delay: ${d.avg_arr_delay ?? "n/a"}m<br>
          delay rate: ${d.pct_delayed != null ? (d.pct_delayed * 100).toFixed(1) + "%" : "n/a"}
        `)
        .style("left", (e.pageX + 12) + "px")
        .style("top", (e.pageY - 18) + "px");

      routes.attr("opacity", route => {
        const routeSource = typeof route.source === "object" ? route.source.id : route.source;
        const routeTarget = typeof route.target === "object" ? route.target.id : route.target;
        return (routeSource === src && routeTarget === dst) ? 1 : 0.05;
      });
    })

    .on("mousemove", (e) => {
      tooltip
        .style("left", (e.pageX + 12) + "px")
        .style("top", (e.pageY - 18) + "px");
    })

    .on("mouseout", () => {
      tooltip.style("opacity", 0);
      if (selectedRoute) {
        applySelectedRouteHighlight();
      } else {
        routes.attr("opacity", 0.16).attr("stroke", "var(--route)");
      }
    });

  routeSelection = routes;

  // FILTER VALID NODES (FIX)
  const validNodes = network.nodes.filter(d => {
    if(!d.lat || !d.lon) return false;
    const p = projection([d.lon,d.lat]);
    return p !== null;
  });

  // AIRPORTS (FIXED)
  g.selectAll("circle")
    .data(validNodes)
    .join("circle")
    .attr("cx", d => projection([d.lon,d.lat])[0])
    .attr("cy", d => projection([d.lon,d.lat])[1])
    .attr("r",5)
    .attr("fill", d=>color(d.pct_delayed))
    .attr("stroke","#ffffff")
    .attr("stroke-width",1.2)

    .on("mouseover",(e,d)=>{
      const flightCount = d.total_flights?.toLocaleString?.() ?? d.total_flights;
      tooltip.style("opacity",1)
        .html(`<b>${d.id}</b><br>${d.city || ""}<br>${flightCount} flights`)
        .style("left",(e.pageX+10)+"px")
        .style("top",(e.pageY-20)+"px");
    })

    .on("mouseout",()=>tooltip.style("opacity",0))

    .on("click",(e,d)=>{
      updatePanel(d);
      highlightRoutes(d);
    });
});

function initRouteChecker(network) {
  const srcSelect = document.getElementById("route-src");
  const dstSelect = document.getElementById("route-dst");
  const checkBtn = document.getElementById("route-check-btn");

  const airportCodes = [...network.nodes]
    .map(n => n.id)
    .filter(Boolean)
    .sort((a, b) => a.localeCompare(b));

  destinationsBySource = new Map();
  network.edges.forEach(edge => {
    const source = typeof edge.source === "object" ? edge.source.id : edge.source;
    const target = typeof edge.target === "object" ? edge.target.id : edge.target;
    if (!source || !target) return;

    if (!destinationsBySource.has(source)) {
      destinationsBySource.set(source, new Set());
    }
    destinationsBySource.get(source).add(target);
  });

  srcSelect.innerHTML = airportCodes
    .map(code => `<option value="${code}">${code}</option>`)
    .join("");

  const populateDestinations = (sourceCode) => {
    const targets = [...(destinationsBySource.get(sourceCode) || new Set())]
      .sort((a, b) => a.localeCompare(b));

    if (targets.length === 0) {
      dstSelect.innerHTML = "<option value=''>No outgoing routes</option>";
      dstSelect.disabled = true;
      checkBtn.disabled = true;
      return;
    }

    dstSelect.disabled = false;
    checkBtn.disabled = false;
    dstSelect.innerHTML = targets
      .map(code => `<option value="${code}">${code}</option>`)
      .join("");
  };

  srcSelect.addEventListener("change", () => {
    populateDestinations(srcSelect.value);
    setRouteResult("Choose a destination and click Check route.", true);
  });

  checkBtn.addEventListener("click", async () => {
    await checkRoute(srcSelect.value, dstSelect.value);
  });

  if (airportCodes.length > 0) {
    srcSelect.value = airportCodes[0];
    populateDestinations(srcSelect.value);
  }
}

function setRouteResult(message, muted = false) {
  const routeResult = document.getElementById("route-result");
  routeResult.className = muted ? "route-result muted" : "route-result";
  routeResult.innerHTML = message;
}

async function checkRoute(sourceCode, targetCode) {
  if (!sourceCode || !targetCode) {
    selectedRoute = null;
    clearRouteHighlight();
    setRouteResult("Select both origin and destination.", true);
    return;
  }

  setRouteResult("Loading route details...", true);

  try {
    const response = await fetch(`/api/route/${encodeURIComponent(sourceCode)}/${encodeURIComponent(targetCode)}`);
    const payload = await response.json();

    if (!response.ok) {
      selectedRoute = null;
      clearRouteHighlight();
      setRouteResult(payload.error || "Route lookup failed.", true);
      return;
    }

    selectedRoute = {
      source: sourceCode,
      target: targetCode
    };
    applySelectedRouteHighlight();

    const flightCount = payload.flight_count?.toLocaleString?.() ?? payload.flight_count ?? "n/a";
    const avgDelay = payload.avg_arr_delay != null ? `${payload.avg_arr_delay}m` : "n/a";
    const delayRate = payload.pct_delayed != null
      ? `${(payload.pct_delayed * 100).toFixed(1)}%`
      : "n/a";

    setRouteResult(
      `<b>${sourceCode} -> ${targetCode}</b><br>` +
      `Flights: ${flightCount}<br>` +
      `Avg delay: ${avgDelay}<br>` +
      `Delay rate: ${delayRate}`
    );
  } catch (err) {
    selectedRoute = null;
    clearRouteHighlight();
    setRouteResult("Could not reach route API.", true);
  }
}

function applySelectedRouteHighlight() {
  if (!routeSelection || !selectedRoute) return;

  routeSelection
    .attr("opacity", route => {
      const routeSource = typeof route.source === "object" ? route.source.id : route.source;
      const routeTarget = typeof route.target === "object" ? route.target.id : route.target;
      return (routeSource === selectedRoute.source && routeTarget === selectedRoute.target) ? 1 : 0.05;
    })
    .attr("stroke", route => {
      const routeSource = typeof route.source === "object" ? route.source.id : route.source;
      const routeTarget = typeof route.target === "object" ? route.target.id : route.target;
      return (routeSource === selectedRoute.source && routeTarget === selectedRoute.target)
        ? "var(--route-active)"
        : "var(--route)";
    });
}

function clearRouteHighlight() {
  if (!routeSelection) return;
  routeSelection
    .attr("opacity", 0.16)
    .attr("stroke", "var(--route)");
}

// ROUTE HIGHLIGHT FIX
function highlightRoutes(selected){
  g.selectAll("path.route")
    .attr("opacity", d => {
      if (!d.source) return 0.16;

      const s = typeof d.source === "object" ? d.source.id : d.source;
      const t = typeof d.target === "object" ? d.target.id : d.target;

      return (s === selected.id || t === selected.id) ? 1 : 0.045;
    });
}

// PANEL
function updatePanel(d){

  document.getElementById("airport").textContent = d.id;
  document.getElementById("city").textContent = d.city || "Unknown";

  document.getElementById("avg").textContent =
    d.avg_arr_delay.toFixed(1)+"m";

  document.getElementById("flights").textContent =
    d.total_flights;

  const sorted = [...networkData.nodes]
    .sort((a,b)=>b.pct_delayed-a.pct_delayed);

  const rank = sorted.findIndex(n=>n.id===d.id)+1;
  document.getElementById("rank").textContent = "#"+rank;

  const avg = d3.mean(networkData.nodes,n=>n.pct_delayed);
  const diff = ((d.pct_delayed-avg)*100).toFixed(1);

  const v = document.getElementById("verdict");

  if(d.pct_delayed>0.25){
    v.className="high";
    v.innerHTML=`High delays (${diff}% vs avg)`;
  } else if(d.pct_delayed<0.15){
    v.className="low";
    v.innerHTML=`Low delays (${diff}% vs avg)`;
  } else {
    v.className="medium";
    v.innerHTML=`Moderate delays (${diff}% vs avg)`;
  }

  drawBars(d.id);
  showAlternatives(d);
}

function drawBars(code){

  const bd = breakdownData[code];
  if(!bd) return;

  const container = document.getElementById("bars");
  container.innerHTML="";

  const labels = {
    carrier:"Airline ops",
    late_aircraft:"Late aircraft",
    nas:"Air traffic",
    weather:"Weather",
    security:"Security"
  };

  const data = Object.entries(bd)
    .map(([k,v])=>({key:k,val:v}))
    .sort((a,b)=>b.val-a.val);

  const max = d3.max(data,d=>d.val);

  data.forEach(d=>{
    const w = (d.val/max)*100;

    container.innerHTML += `
      <div>
        <div>${labels[d.key]}</div>
        <div class="bar-bg">
          <div class="bar-fill" style="width:${w}%; background:#3b82f6;"></div>
        </div>
      </div>
    `;
  });

  const explainMap = {
    carrier:"Airline operations are the main cause.",
    late_aircraft:"Late planes cause ripple delays.",
    nas:"Air traffic congestion dominates.",
    weather:"Weather disruptions dominate.",
    security:"Security delays dominate."
  };

  document.getElementById("explain").innerHTML =
    `<b>Why delays happen:</b> ${explainMap[data[0].key]}`;
}

function showAlternatives(d){
  const better = networkData.nodes
    .filter(n=>n.id!==d.id)
    .sort((a,b)=>a.pct_delayed-b.pct_delayed)
    .slice(0,3);

  document.getElementById("alternatives").innerHTML =
    "<b>Better alternatives:</b><br>" +
    better.map(n=>n.id).join(", ");
}

</script>

</body>
</html>
